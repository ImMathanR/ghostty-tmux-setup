# ~/.tmux.conf

# Use login shell so ~/.bash_profile is sourced in every pane
set -g default-command "bash -l"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support (scroll, pane select, resize)
set -g mouse on

# Splits
bind -n M-d split-window -h
bind -n M-D split-window -v

# Navigate panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# New window
bind -n M-t new-window

# Switch windows
bind -n M-1 select-window -t 0
bind -n M-2 select-window -t 1
bind -n M-3 select-window -t 2
bind -n M-4 select-window -t 3
bind -n M-5 select-window -t 4

# Close pane
bind -n M-w kill-pane

# Zoom toggle
bind -n M-z resize-pane -Z

# Resize panes
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-K resize-pane -U 5
bind -n M-J resize-pane -D 5
