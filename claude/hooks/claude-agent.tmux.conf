# ── Claude Code agent state in tmux ──────────────────────────────────────────
# Loaded by every tmux config in use (tas's config/tmux/tmux.conf and
# ~/.tmux.conf). Load it BEFORE tpm/plugins run so crash restore sees it.
#
# ~/.claude/hooks/tmux-agent-state.sh sets @agent per window; the painter
# (tmux-agent-anim.py) animates tab titles into @agent_fmt:
#   working  light sweeps through the name
#   ask      tab breathes pink until you answer (and pleads after 2 min)
#   done     mint fills in, blooms, then cools over 10 min
#   failed   shrug, then the name cracks like glass with a red pen circle
# Frames only recolour " #I:#W ", so tabs never change width.

# Ghostty draws coloured curly underlines; tmux only emits them when told.
if -F '#{m:*xterm-ghostty:usstyle*,#{terminal-features}}' '' 'set -as terminal-features ",xterm-ghostty:usstyle"'

# Wrap the host config's tab formats, status-right and window naming.
run-shell "sh ~/.claude/hooks/tmux-agent-install.sh"

# Looking at a finished tab clears it (switching tabs, or focusing Ghostty).
set-hook -g session-window-changed 'if -F "#{==:#{@agent},done}" "set -wu @agent"'
set-hook -g pane-focus-in          'if -F "#{==:#{@agent},done}" "set -wu @agent"'

# prefix + j (Cmd+J in Ghostty): peek at every agent tab, most urgent first.
bind j display-popup -E -w 90% -h 75% -b rounded -S "fg=#333333" -T "#[fg=#FFC107] peek " "python3 ~/.claude/hooks/tmux-agent-peek.py"

# Crash restore (tmux-resurrect): a Claude pane comes back in the exact
# conversation it had, recorded per pane by the hook (claude_sessions.py).
set -g @resurrect-processes '"~claude->python3 $HOME/.claude/hooks/claude_sessions.py resume"'

# The ▦ button left of the scoreboard opens birdseye: every tab as a live text
# card in a tab of its own; click a card to jump to it. Other status-bar clicks
# keep tmux's default (switch to the clicked tab).
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},birdseye}' 'run-shell -b "sh ~/.claude/hooks/tmux-birdseye-open.sh"' 'switch-client -t ='

# Wake birdseye the moment tabs change, so it can show or hide its map at once
# while only checking rarely on its own. Signals the pid it recorded (a pattern
# match like pkill -f would also hit this very shell); prints nothing, so tmux
# never overlays a message on the pane.
set-hook -g session-window-changed[1] 'run-shell -b "kill -USR1 $(cat ~/.claude/hooks/.birdseye.pid 2>/dev/null) 2>/dev/null; true"'
set-hook -g client-session-changed[1] 'run-shell -b "kill -USR1 $(cat ~/.claude/hooks/.birdseye.pid 2>/dev/null) 2>/dev/null; true"'


# Start the painter whenever tmux starts (or reloads this file), so tabs animate
# right away after a Ghostty restart. It holds a lock, so a second copy exits.
# AGENT_NO_PAINTER=1 in the server's environment skips this (install.sh's check).
run-shell -b "[ -n \"\$AGENT_NO_PAINTER\" ] || nohup python3 ~/.claude/hooks/tmux-agent-anim.py </dev/null >/dev/null 2>&1 &"
