# ── tmux.conf ────────────────────────────────────────────────────
# Installed as ~/.tmux.conf. Ghostty's Cmd shortcuts (ghostty/config) send
# "prefix + key", so every key they send has a binding here.

# -- General --
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
set -g repeat-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough all
setw -g mode-keys vi

# -- Prefix: Ctrl+a (easier than Ctrl+b) --
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -- Splits: intuitive keys --
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Cmd+D (prefix + C-d): split right. TAS's tas-keys.conf replaces this with
# "duplicate line" inside its nvim pane.
bind C-d split-window -h -c "#{pane_current_path}"

# -- New window keeps current path --
bind c new-window -c "#{pane_current_path}"

# -- Pane navigation: Alt+arrow (no prefix needed) --
# Alt+Left/Right pass through to nvim (buffer tabs) when nvim pane is active,
# otherwise navigate panes. Alt+Up/Down always navigate panes.
bind -n M-Left  if-shell '[ "#{pane_id}" = "$(tmux show-option -wqv @nvim_pane)" ]' \
  'send-keys M-Left'  'select-pane -L'
bind -n M-Right if-shell '[ "#{pane_id}" = "$(tmux show-option -wqv @nvim_pane)" ]' \
  'send-keys M-Right' 'select-pane -R'
bind -n M-Up   select-pane -U
bind -n M-Down select-pane -D

# -- Pane navigation: prefix + arrow keys (for Ghostty Cmd+Arrow bindings) --
bind Left select-pane -L
bind Right select-pane -R
bind Up select-pane -U
bind Down select-pane -D

# -- Resize panes: prefix + HJKL --
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -- Window navigation: prefix + number --
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# -- Zoom pane (Cmd+Shift+Enter → prefix + Z) --
bind Z resize-pane -Z

# -- Clear screen + scrollback (Cmd+K → prefix + k, or prefix + Ctrl-z) --
bind k send-keys C-l \; run-shell "sleep 0.1" \; clear-history
bind C-z send-keys C-l \; clear-history

# -- Lazygit popup (Cmd+L → prefix + ') --
bind "'" display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# -- Close pane without confirmation (prefix + x) --
bind x kill-pane

# -- Close entire window/tab without confirmation (prefix + Ctrl-w) --
bind C-w kill-window

# -- Reload config --
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# -- Status bar: Gruvbox Dark with gold accent --
set -g status-position bottom
set -g status-style "bg=default,fg=#a89984"
set -g status-left " #[fg=#d79921,bold]#S #[default]"
set -g status-left-length 20
# status-right also carries continuum's periodic auto-save hook. It is hardcoded
# here (rather than left to continuum to inject at load) so saves keep running
# even if continuum's startup guard ("another tmux server is running") misfires.
# continuum_save.sh itself only checks the save interval, so this is safe.
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#[fg=#665c54]%H:%M "
set -g window-status-format " #[fg=#665c54]#I:#W "
set -g window-status-current-format " #[fg=#d79921,bold]#I:#W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"
set -g message-style "bg=default,fg=#d79921"

# -- Session Persistence (auto-save & auto-restore) --
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# -- TAS bindings (gradle, device mirror, git), if TAS is installed --
source-file -q ~/.config/tas/tas-keys.conf

# -- Claude Code agent tabs, stickers and crash restore (before plugins load) --
source-file -q ~/.claude/hooks/claude-agent.tmux.conf

# -- Machine-specific overrides that stay out of the repo --
source-file -q ~/.tmux.local.conf

# -- Plugins --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tpm prefers an inherited TMUX_PLUGIN_MANAGER_PATH (another tmux setup can
# export one), so pin it to where install.sh puts the plugins.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
